[package]
name = "dlv-list"
version = "0.6.0"
authors = ["Scott Godwin <sgodwincs@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/sgodwincs/dlv-list-rs"
description = "Semi-doubly linked list implemented using a vector"
readme = "README.md"
categories = ["data-structures"]
keywords = ["vector", "linked", "list"]

[dependencies]
const-random = { version = "0.1.15", optional = true }
serde = { version = "1", optional = true, default-features = false }
syn = "2.0.110"

[dev-dependencies]
coverage-helper = "0.2.0"
serde_test = "1.0.144"

[features]
default = ["std"]
std = []
const-random = ["dep:const-random"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage_nightly)',
    'cfg(mutants)',
] }

[workspace]

[package.metadata.cargo2nix]
cargo2nix_path = "/data/data/com.termux.nix/files/home/pick-up-nix2/vendor/rust/cargo2nix/target/debug/cargo2nix"
